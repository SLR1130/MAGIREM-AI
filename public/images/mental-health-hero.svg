<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="#1DD1A1" opacity="0.9"/>
  
  <!-- Head -->
  <path d="M120 250 Q120 180 200 180 Q280 180 280 250 Q280 320 200 320 Q120 320 120 250 Z" fill="#A3E635" stroke="#000" stroke-width="3"/>
  
  <!-- Eyes -->
  <path d="M160 220 Q160 210 170 210 Q180 210 180 220" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <path d="M220 220 Q220 210 230 210 Q240 210 240 220" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M170 270 Q200 290 230 270" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Brain -->
  <g transform="translate(200, 160)">
    <!-- Brain outline -->
    <path d="M-40 -20 Q-50 -40 -30 -50 Q-10 -60 10 -50 Q30 -40 40 -20 Q45 0 35 15 Q20 25 0 20 Q-20 25 -35 15 Q-45 0 -40 -20 Z" fill="#FFF" stroke="#000" stroke-width="2"/>
    
    <!-- Brain divisions -->
    <path d="M0 -50 Q0 -30 0 20" stroke="#000" stroke-width="2"/>
    <path d="M-20 -35 Q0 -25 20 -35" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M-25 -10 Q0 0 25 -10" fill="none" stroke="#000" stroke-width="1.5"/>
  </g>
  
  <!-- Left Plant -->
  <g transform="translate(140, 120)">
    <!-- Stem -->
    <line x1="0" y1="0" x2="0" y2="60" stroke="#000" stroke-width="3"/>
    <!-- Leaves -->
    <ellipse cx="-8" cy="15" rx="6" ry="12" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="8" cy="25" rx="6" ry="12" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(30)"/>
    <ellipse cx="-8" cy="35" rx="6" ry="12" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="8" cy="45" rx="6" ry="12" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(30)"/>
  </g>
  
  <!-- Right Plant -->
  <g transform="translate(260, 120)">
    <!-- Stem -->
    <line x1="0" y1="0" x2="0" y2="60" stroke="#000" stroke-width="3"/>
    <!-- Leaves -->
    <ellipse cx="-8" cy="15" rx="6" ry="12" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="8" cy="25" rx="6" ry="12" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(30)"/>
    <ellipse cx="-8" cy="35" rx="6" ry="12" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="8" cy="45" rx="6" ry="12" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(30)"/>
  </g>
  
  <!-- Left Flower -->
  <g transform="translate(110, 100)">
    <!-- Stem -->
    <line x1="0" y1="20" x2="0" y2="50" stroke="#000" stroke-width="2"/>
    <!-- Petals -->
    <circle cx="0" cy="20" r="15" fill="#FFF" stroke="#000" stroke-width="2"/>
    <circle cx="-10" cy="10" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
    <circle cx="10" cy="10" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
    <circle cx="-10" cy="30" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
    <circle cx="10" cy="30" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
    <!-- Center -->
    <circle cx="0" cy="20" r="5" fill="#FFF" stroke="#000" stroke-width="2"/>
  </g>
  
  <!-- Right Flower -->
  <g transform="translate(290, 100)">
    <!-- Stem -->
    <line x1="0" y1="20" x2="0" y2="50" stroke="#000" stroke-width="2"/>
    <!-- Petals -->
    <circle cx="0" cy="20" r="15" fill="#FFF" stroke="#000" stroke-width="2"/>
    <circle cx="-10" cy="10" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
    <circle cx="10" cy="10" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
    <circle cx="-10" cy="30" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
    <circle cx="10" cy="30" r="8" fill="#FFF" stroke="#000" stroke-width="2"/>
    <!-- Center -->
    <circle cx="0" cy="20" r="5" fill="#FFF" stroke="#000" stroke-width="2"/>
  </g>
</svg>